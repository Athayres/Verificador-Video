name = "verificador-videos"
main = "index.js"
compatibility_date = "2026-01-01"

# Mantém no deploy as variáveis/secrets cadastrados no painel
keep_vars = true

# Liga os logs do Worker (painel: Workers & Pages > verificador-videos > Observability / Logs)
[observability]
enabled = true

# Mesmo KV do outro projeto (guarda TMDB_KEY e SECRET como entradas, e o cache de veredito).
[[kv_namespaces]]
binding = "KV"
id = "1cd06a5363d1444fa7bcf08be3926a6f"

# Ligação interna com o Worker do Controle de Impróprios (a Cloudflare bloqueia Worker chamando Worker pelo workers.dev: erro 1042).
# "service" é o nome do Worker do Controle (o que aparece no endereço dele: controle-de-improprio.<sua-conta>.workers.dev).
# quem ficar no topo chama o outro desmacar 3 linhas quem ficar em baixo comentar
# [[services]]
# binding = "CONTROLE"
# service = "controle-de-improprio"
